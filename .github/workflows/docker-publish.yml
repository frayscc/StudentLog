name: Publish Docker image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "backend/**"
      - "frontend/**"
      - "scripts/**"
      - ".github/workflows/docker-publish.yml"

concurrency:
  group: studentlog-docker-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Verify backend and simulated DeepSeek failures
        env:
          DATA_DIR: ${{ runner.temp }}/studentlog-unit-data
          MODELS_DIR: ${{ runner.temp }}/studentlog-unit-models
          LLM_PROVIDER: mock
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pytest backend/tests -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build release image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          build-args: INSTALL_ASR=1
          tags: |
            frayscc/studentlog:latest
            frayscc/studentlog:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Docker persistence and workflows
        run: python3 scripts/docker_smoke_test.py --image frayscc/studentlog:${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: frayscc
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push verified image
        run: |
          docker push frayscc/studentlog:${{ github.sha }}
          docker push frayscc/studentlog:latest
