services:
  studentlog:
    image: docker.io/frayscc/studentlog:latest
    pull_policy: always
    ports:
      - "8765:8765"
    environment:
      APP_SECRET: ${APP_SECRET:-change-this-secret}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ASR_PROVIDER: ${ASR_PROVIDER:-paraformer}
      ASR_ALLOW_MODEL_DOWNLOAD: ${ASR_ALLOW_MODEL_DOWNLOAD:-false}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    restart: "no"
